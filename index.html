<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#15181e">
<meta name="description" content="歌や楽器を録って、ハモリを重ね、一部分だけ録り直して、一曲に書き出すアプリ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="かさね録り">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>かさね録り</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="btnSongs" class="icon-btn" type="button" aria-label="曲の一覧">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button id="songName" class="song-name" type="button" aria-label="曲の名前を変える">かさね録り</button>
    <span id="testBadge" class="test-badge" hidden>テスト</span>
    <button id="btnUndo" class="icon-btn" type="button" aria-label="取り消し" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="btnRedo" class="icon-btn" type="button" aria-label="やり直し" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <button id="btnMore" class="icon-btn" type="button" aria-label="その他（書き出し・読み込み・設定）">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <main id="timeline" class="timeline" aria-label="トラックとフレーズ"></main>

  <div class="statusbar">
    <div id="meter" class="meter" hidden><div class="meter-bar"></div></div>
    <span id="timeText" class="time" aria-live="off">0:00.0</span>
    <div class="chips">
      <button id="btnTempo" class="chip" type="button" aria-label="テンポと拍子">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4v11.5"/><ellipse cx="10.5" cy="16.5" rx="3.5" ry="2.7" fill="currentColor" stroke="none"/></svg>
        <span id="tempoText">120</span>
      </button>
      <button id="btnMetro" class="chip" type="button" aria-pressed="false" aria-label="メトロノーム">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l4 18H5L9 3Z"/><path d="m12 16 5-9"/></svg>
        <span class="long">メトロノーム</span>
      </button>
      <button id="btnLoop" class="chip" type="button" aria-pressed="false" aria-label="くり返し">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="m7 22-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>
        <span>くり返し</span>
      </button>
    </div>
  </div>

  <nav class="transport" aria-label="再生と録音">
    <button id="btnHome" class="t-btn" type="button" aria-label="頭に戻る">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.6" height="14" rx="1"/><path d="M19 5.8v12.4a.8.8 0 0 1-1.2.7L9.4 12.7a.8.8 0 0 1 0-1.4l8.4-6.2a.8.8 0 0 1 1.2.7Z"/></svg>
    </button>
    <button id="btnPlay" class="t-btn" type="button" aria-label="再生">
      <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4a.8.8 0 0 0 1.2.7l11.4-7.2a.8.8 0 0 0 0-1.4L8.2 4.1A.8.8 0 0 0 7 4.8Z"/></svg>
      <svg id="icoStop" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <button id="btnRec" class="rec-btn" type="button" aria-label="録音">
      <span class="rec-dot"></span>
      <span id="recMode" class="rec-mode" hidden>範囲</span>
    </button>
    <button id="btnMixer" class="t-btn wide" type="button" aria-label="ミキサー（音量）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4v16M12 4v16M18 4v16"/><rect x="3.5" y="13" width="5" height="3" rx="1" fill="currentColor"/><rect x="9.5" y="7" width="5" height="3" rx="1" fill="currentColor"/><rect x="15.5" y="15" width="5" height="3" rx="1" fill="currentColor"/></svg>
      <span>ミキサー</span>
    </button>
  </nav>
</div>
<input id="fileAudio" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac" hidden>
<input id="fileBackup" type="file" accept=".kasane,application/octet-stream" hidden>
<div id="sheetHost"></div>
<div id="toastHost" aria-live="polite"></div>
</body>
</html>
